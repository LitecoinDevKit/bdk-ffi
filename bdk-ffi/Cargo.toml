# Standalone package (not a member of the parent BDK workspace).
[workspace]

[package]
name = "bdk-ffi"
version = "3.1.0-litecoin.1"
homepage = "https://bitcoindevkit.org"
repository = "https://github.com/IndigoNakamoto/bdk-ffi"
edition = "2018"
license = "MIT OR Apache-2.0"
description = "UniFFI language bindings for the Litecoin BDK fork (with MWEB)"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "bdkffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# Rev-pinned forks so a standalone clone builds reproducibly. The bdk.git rev
# below MUST match the rev bdk_wallet's own manifest pins (checked in CI),
# otherwise Cargo builds two copies of bdk_chain/bdk_mweb and types stop
# unifying. For local development, add [patch] overrides in .cargo/config.toml
# pointing at sibling checkouts (see README).
bdk_wallet = { git = "https://github.com/IndigoNakamoto/bdk_wallet.git", rev = "5118184083a2451f49996324f132dfe05c8a8318", version = "=3.1.0-litecoin.0", features = ["all-keys", "keys-bip39", "rusqlite", "mweb", "mweb-sqlite"] }
bdk_esplora = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", version = "0.22.1", default-features = false, features = ["std", "blocking", "blocking-https-rustls"] }
bdk_electrum = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", version = "0.23.2", default-features = false, features = ["use-rustls-ring"] }
bdk_mweb = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", version = "0.1.0", default-features = false, features = ["std", "zkp", "persist", "rusqlite", "lip0006"] }

uniffi = { version = "=0.31.2", features = ["cli"]}
thiserror = "2.0.17"

[build-dependencies]
uniffi = { version = "=0.31.2", features = ["build"] }

[dev-dependencies]
uniffi = { version = "=0.31.2", features = ["bindgen-tests"] }
assert_matches = "1.5.0"

[profile.release-smaller]
inherits = "release"
opt-level = 'z'     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = "abort"     # Abort on panic
strip = "debuginfo" # Partially strip symbols from binary

# Until crates.io publishes litecoin 0.32.8-rc.2 (native PSBTv2 MWEB maps).
# Must stay on the same rev the bdk fork pins, so litecoin types unify.
[patch.crates-io]
litecoin = { git = "https://github.com/IndigoNakamoto/rust-litecoin.git", rev = "0b3285337f3cc508a5549d245ce20d3b52418f3a" }
