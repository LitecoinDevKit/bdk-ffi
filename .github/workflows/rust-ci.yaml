name: Rust Continuous Integration

# Continuous integration for the Rust bdk-ffi layer of the Litecoin BDK fork.
# All fork dependencies are rev-pinned git deps in bdk-ffi/Cargo.toml, so a
# plain checkout builds standalone.

on:
  workflow_dispatch:
  push:
    paths:
      - "bdk-ffi/**"
      - "scripts/**"
      - ".github/**"
  pull_request:
    paths:
      - "bdk-ffi/**"
      - "scripts/**"
      - ".github/**"

permissions: {}

jobs:
  test:
    name: "Run tests"
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Check dependency rev coherence"
        run: bash ./scripts/check-rev-coherence.sh

      - name: "Set up Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          rustflags: "-D warnings"

      - name: "Build"
        working-directory: bdk-ffi
        run: cargo build --locked

      - name: "Test"
        working-directory: bdk-ffi
        run: cargo test --locked

  check:
    name: "Run clippy and fmt"
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          rustflags: "-D warnings"
          components: clippy, rustfmt

      - name: "Check fmt"
        working-directory: bdk-ffi
        run: cargo fmt --all -- --config format_code_in_doc_comments=true --check

      - name: "Check clippy"
        working-directory: bdk-ffi
        run: cargo clippy --locked --all-targets
