name: Rust Continuous Integration

# Continuous integration for the Rust bdk-ffi layer of the Litecoin BDK fork.
# The crate depends on path deps into the IndigoNakamoto/bdk monorepo, so the
# setup-workspace action first reconstructs the nested checkout layout.

on:
  workflow_dispatch:
  push:
    paths:
      - "bdk-ffi/**"
      - ".github/**"
  pull_request:
    paths:
      - "bdk-ffi/**"
      - ".github/**"

permissions: {}

jobs:
  test:
    name: "Run tests"
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Set up Litecoin BDK workspace"
        uses: ./.github/actions/setup-workspace

      - name: "Set up Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: "Build"
        working-directory: bdk/bdk-ffi/bdk-ffi
        run: cargo build

      - name: "Test"
        working-directory: bdk/bdk-ffi/bdk-ffi
        run: cargo test

  check:
    name: "Run clippy and fmt"
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Set up Litecoin BDK workspace"
        uses: ./.github/actions/setup-workspace

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: clippy, rustfmt

      - name: "Check fmt"
        working-directory: bdk/bdk-ffi/bdk-ffi
        run: cargo fmt --all -- --config format_code_in_doc_comments=true --check

      - name: "Check clippy"
        working-directory: bdk/bdk-ffi/bdk-ffi
        run: cargo clippy --all-targets
