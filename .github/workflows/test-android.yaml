name: Test Android

# Builds the Android bindings for the Litecoin bdk-ffi fork:
# cross-compiles the Rust native libraries for all supported ABIs,
# generates the Kotlin bindings, and assembles the release AAR.
#
# Note: upstream's emulator-based connected tests ran against a Bitcoin
# regtest container; they are disabled here until a Litecoin regtest
# image is available.

on:
  workflow_dispatch:
  push:
    paths:
      - "bdk-ffi/**"
      - "bdk-android/**"
      - ".github/**"
  pull_request:
    paths:
      - "bdk-ffi/**"
      - "bdk-android/**"
      - ".github/**"

permissions: {}

jobs:
  build:
    name: "Build Android library"
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Set up JDK"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v4

      - name: "Set up Android NDK"
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: "Set up Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: "Build native libraries and Kotlin bindings"
        working-directory: bdk-android
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash ./scripts/release/build-release-linux-x86_64.sh

      - name: "Assemble release AAR"
        working-directory: bdk-android
        run: ./gradlew :lib:assembleRelease --console=plain

      - name: "Upload AAR artifact"
        uses: actions/upload-artifact@v4
        with:
          name: bdk-ltc-android-aar
          path: bdk-android/lib/build/outputs/aar/*.aar
