name: Test Swift

# Builds the Swift bindings for the Litecoin bdk-ffi fork on macOS:
# compiles the Rust libraries for all Apple targets, assembles the
# bdkffi.xcframework, and runs the Swift package tests.

on:
  workflow_dispatch:
  push:
    paths:
      - "bdk-ffi/**"
      - "bdk-swift/**"
      - ".github/**"
  pull_request:
    paths:
      - "bdk-ffi/**"
      - "bdk-swift/**"
      - ".github/**"

permissions: {}

jobs:
  test:
    name: "Test Swift library"
    runs-on: macos-15

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          rustflags: "-D warnings"

      - name: "Build Swift package"
        working-directory: bdk-swift
        run: bash ./build-xcframework.sh

      - name: "Run Swift tests"
        working-directory: bdk-swift
        run: swift test
