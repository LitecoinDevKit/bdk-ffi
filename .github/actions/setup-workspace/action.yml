name: "Set up Litecoin BDK workspace"
description: >
  The bdk-ffi crate uses path dependencies (../../bdk_wallet, ../../crates/*)
  that only resolve when this repository is nested inside a checkout of the
  Litecoin BDK monorepo. This action clones IndigoNakamoto/bdk and
  IndigoNakamoto/bdk_wallet and moves the current checkout into place, so the
  final layout under $GITHUB_WORKSPACE is:

    bdk/                 IndigoNakamoto/bdk (litecoin branch)
      bdk_wallet/        IndigoNakamoto/bdk_wallet (litecoin branch)
      bdk-ffi/           this repository's checkout
        bdk-ffi/         the Rust crate

  All subsequent steps should use working-directory paths under bdk/bdk-ffi/.

inputs:
  bdk-ref:
    description: "Branch/tag of IndigoNakamoto/bdk to clone"
    required: false
    default: "litecoin"
  bdk-wallet-ref:
    description: "Branch/tag of IndigoNakamoto/bdk_wallet to clone"
    required: false
    default: "litecoin"

runs:
  using: composite
  steps:
    - name: "Nest checkout inside Litecoin BDK monorepo"
      shell: bash
      env:
        BDK_REF: ${{ inputs.bdk-ref }}
        BDK_WALLET_REF: ${{ inputs.bdk-wallet-ref }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        mkdir -p .parent
        git clone --depth 1 --branch "$BDK_REF" https://github.com/IndigoNakamoto/bdk.git .parent/bdk
        git clone --depth 1 --branch "$BDK_WALLET_REF" https://github.com/IndigoNakamoto/bdk_wallet.git .parent/bdk/bdk_wallet
        mkdir -p .parent/bdk/bdk-ffi
        # Move the entire bdk-ffi checkout (including dotfiles) into the nested location.
        find . -mindepth 1 -maxdepth 1 -not -name .parent -exec mv {} .parent/bdk/bdk-ffi/ \;
        mv .parent/bdk bdk
        rmdir .parent
        echo "Workspace layout:"
        ls bdk bdk/bdk-ffi
